name: Build iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Install CocoaPods
        run: pod install --repo-update

      - name: Build GetBored iOS
        run: |
          xcodebuild \
            -workspace GetBoredIOS.xcworkspace \
            -scheme "GetBored iOS" \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Debug builds load JS from Metro and never exercise the RN bundling
      # build phase, so a broken/missing "Bundle React Native code and
      # images" phase (or a wrong PROJECT_ROOT) only surfaces in Release —
      # exactly the class of bug that shipped an unlaunchable TestFlight
      # build. Build Release here and assert main.jsbundle actually landed.
      - name: Build GetBored iOS (Release)
        run: |
          xcodebuild \
            -workspace GetBoredIOS.xcworkspace \
            -scheme "GetBored iOS" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./iOSDeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify Release JS bundle is embedded
        run: |
          BUNDLE_PATH="./iOSDeviceDerivedData/Build/Products/Release-iphoneos/GetBored.app/main.jsbundle"
          if [ ! -f "$BUNDLE_PATH" ]; then
            echo "::error::$BUNDLE_PATH is missing — the RN bundling build phase did not run or produced no output."
            exit 1
          fi
