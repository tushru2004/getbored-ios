name: Build iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java (Kotlin/Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Build GetBoredSharedCore XCFramework (KMP)
        run: ./gradlew :shared-kotlin:assembleGetBoredSharedCoreXCFramework

      - name: Install CocoaPods
        run: pod install --repo-update

      - name: Build GetBored iOS
        run: |
          xcodebuild \
            -workspace GetBoredIOS.xcworkspace \
            -scheme "GetBored iOS" \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
