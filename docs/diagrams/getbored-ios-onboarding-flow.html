<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GetBored iOS v1 — Onboarding &amp; Activation Flow</title>
<style>
  :root {
    --bg:      #f6f7fb;
    --dot:     #cdd2dc;
    --text:    #0f172a;
    --muted:   #64748b;
    --edge:    #475569;
  }
  html, body { margin: 0; padding: 0; background: #ffffff; }
  svg { display: block; width: 100%; height: auto; }
  text {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  }
  .mono {
    font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
</style>
</head>
<body>
<svg viewBox="0 0 1160 1330" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GetBored iOS v1 onboarding and activation flow">
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#cdd2dc"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- one marker per arrow family, user-space sized, auto-oriented -->
    <marker id="mSlate" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="mRed" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="mGreen" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- background: light panel + dot pattern (self-contained, scales with render) -->
  <rect x="0" y="0" width="1160" height="1330" fill="#f6f7fb"/>
  <rect x="0" y="0" width="1160" height="1330" fill="url(#dots)"/>

  <!-- ===== header ===== -->
  <text x="580" y="52" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">GetBored iOS v1 — Onboarding &amp; Activation Flow</text>
  <text x="580" y="78" text-anchor="middle" font-size="12.5" fill="#64748b">From first App Store launch to on-device filtering · activation via the GetBored REST API (v1 — no CloudKit)</text>

  <!-- ===== happy-path spine nodes (x 120..590, center 355) ===== -->

  <!-- n1: app launch (sky) -->
  <g filter="url(#soft)">
    <rect x="120" y="110" width="470" height="92" rx="14" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
  </g>
  <circle cx="120" cy="138" r="14" fill="#0ea5e9"/>
  <text x="120" y="142.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
  <text x="152" y="142" font-size="15" font-weight="600" fill="#0369a1">App Launch — Setup Required</text>
  <text x="152" y="168" font-size="12" fill="#334155">Fresh install opens to the &#8220;Setup required&#8221; state</text>
  <text x="152" y="187" font-size="12" fill="#64748b">with a clear next step — no CTA dead-end</text>

  <!-- n2: sign in with apple (blue) -->
  <g filter="url(#soft)">
    <rect x="120" y="266" width="470" height="92" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  </g>
  <circle cx="120" cy="294" r="14" fill="#3b82f6"/>
  <text x="120" y="298.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
  <text x="152" y="298" font-size="15" font-weight="600" fill="#1d4ed8">Zero-Tap Onboarding</text>
  <text x="152" y="324" font-size="12" fill="#334155">User taps &#8220;Sign in with Apple&#8221;</text>
  <text x="152" y="343" font-size="12" fill="#64748b">no manual account creation</text>

  <!-- n3: activation code gate (amber) -->
  <g filter="url(#soft)">
    <rect x="120" y="422" width="470" height="100" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
  <circle cx="120" cy="450" r="14" fill="#f59e0b"/>
  <text x="120" y="454.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">3</text>
  <text x="152" y="455" font-size="15" font-weight="600" fill="#b45309">Activation Code Required</text>
  <text x="152" y="481" font-size="12" fill="#334155">Enter a code — or get one via web sign-in</text>
  <text x="152" y="500" font-size="12" fill="#64748b">at the GetBored dashboard</text>

  <!-- n4: REST API validation (violet) -->
  <g filter="url(#soft)">
    <rect x="120" y="586" width="470" height="100" rx="14" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  </g>
  <circle cx="120" cy="614" r="14" fill="#8b5cf6"/>
  <text x="120" y="618.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">4</text>
  <text x="152" y="619" font-size="15" font-weight="600" fill="#6d28d9">Validate Against GetBored REST API</text>
  <text x="152" y="645" font-size="12" fill="#334155">Code checked against the dashboard hosts</text>
  <text x="152" y="664" font-size="12" fill="#64748b">REST API only — v1 migrated off CloudKit</text>

  <!-- n5: auto-connect + auto-sync (sky) -->
  <g filter="url(#soft)">
    <rect x="120" y="750" width="470" height="92" rx="14" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
  </g>
  <circle cx="120" cy="778" r="14" fill="#0ea5e9"/>
  <text x="120" y="782.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">5</text>
  <text x="152" y="782" font-size="15" font-weight="600" fill="#0369a1">Auto-Connect &amp; Auto-Sync</text>
  <text x="152" y="808" font-size="12" fill="#334155">On success the app connects automatically</text>
  <text x="152" y="827" font-size="12" fill="#64748b">and syncs block lists from the REST API</text>

  <!-- n6: protection profile gate (amber) -->
  <g filter="url(#soft)">
    <rect x="120" y="906" width="470" height="100" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
  <circle cx="120" cy="934" r="14" fill="#f59e0b"/>
  <text x="120" y="938.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">6</text>
  <text x="152" y="939" font-size="15" font-weight="600" fill="#b45309">Protection Profile Gate</text>
  <text x="152" y="965" font-size="12" fill="#334155">Activated users are gated on the supervision /</text>
  <text x="152" y="984" font-size="12" fill="#64748b">protection profile being installed</text>

  <!-- n7: steady state (green) -->
  <g filter="url(#soft)">
    <rect x="120" y="1070" width="470" height="140" rx="14" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  </g>
  <circle cx="120" cy="1098" r="14" fill="#10b981"/>
  <text x="120" y="1102.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">7</text>
  <text x="152" y="1102" font-size="15" font-weight="600" fill="#047857">Steady State — On-Device Filtering</text>
  <text x="152" y="1126" font-size="12" fill="#334155">Network Content Filter enforces block-mode rules</text>
  <text x="152" y="1147" font-size="11" fill="#64748b" class="mono">NEFilterDataProvider · content-filter-provider</text>
  <rect x="215" y="1164" width="280" height="32" rx="16" fill="#ffffff" stroke="#10b981" stroke-width="1.25"/>
  <text x="355" y="1184.5" text-anchor="middle" font-size="11" fill="#047857" class="mono">Quiet · N sites blocked · synced HH:MM</text>

  <!-- ===== failure-branch nodes (right gutter, x 720..1080) ===== -->

  <!-- ba: blocked, no activation code (red) -->
  <g filter="url(#soft)">
    <rect x="720" y="422" width="360" height="100" rx="14" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  </g>
  <text x="740" y="455" font-size="15" font-weight="600" fill="#b91c1c">Blocked — Cannot Proceed</text>
  <text x="740" y="481" font-size="12" fill="#334155">No activation code — onboarding stops here</text>
  <text x="740" y="500" font-size="12" fill="#64748b">Get a code from the GetBored dashboard</text>

  <!-- bb: setup guidance, profile missing (red) -->
  <g filter="url(#soft)">
    <rect x="720" y="906" width="360" height="100" rx="14" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  </g>
  <text x="740" y="939" font-size="15" font-weight="600" fill="#b91c1c">Setup Guidance Shown</text>
  <text x="740" y="965" font-size="12" fill="#334155">Profile missing — app shows install steps</text>
  <text x="740" y="984" font-size="12" fill="#64748b">re-checked once the profile is installed</text>

  <!-- ===== happy-path spine arrows (vertical, x=355) ===== -->
  <line x1="355" y1="204" x2="355" y2="263" stroke="#475569" stroke-width="2" marker-end="url(#mSlate)"/>
  <text x="369" y="238" font-size="11" fill="#64748b">begin onboarding</text>

  <line x1="355" y1="360" x2="355" y2="419" stroke="#475569" stroke-width="2" marker-end="url(#mSlate)"/>
  <text x="369" y="394" font-size="11" fill="#64748b">Apple sign-in complete</text>

  <line x1="355" y1="524" x2="355" y2="583" stroke="#475569" stroke-width="2" marker-end="url(#mSlate)"/>
  <text x="369" y="558" font-size="11" fill="#64748b">code submitted / web sign-in</text>

  <line x1="355" y1="688" x2="355" y2="747" stroke="#475569" stroke-width="2" marker-end="url(#mSlate)"/>
  <text x="369" y="722" font-size="11" fill="#64748b">activation valid</text>

  <line x1="355" y1="844" x2="355" y2="903" stroke="#475569" stroke-width="2" marker-end="url(#mSlate)"/>
  <text x="369" y="878" font-size="11" fill="#64748b">activated</text>

  <line x1="355" y1="1008" x2="355" y2="1067" stroke="#475569" stroke-width="2" marker-end="url(#mSlate)"/>
  <text x="369" y="1042" font-size="11" fill="#64748b">profile installed</text>

  <!-- ===== branch a: no activation code (out red dashed, return green dashed) ===== -->
  <line x1="590" y1="452" x2="717" y2="452" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mRed)"/>
  <text x="655" y="444" text-anchor="middle" font-size="10.5" fill="#b91c1c">no activation code</text>

  <line x1="720" y1="496" x2="593" y2="496" stroke="#10b981" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mGreen)"/>
  <text x="655" y="515" text-anchor="middle" font-size="10.5" fill="#047857">code entered · retry</text>

  <!-- ===== branch b: protection profile missing ===== -->
  <line x1="590" y1="936" x2="717" y2="936" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mRed)"/>
  <text x="655" y="928" text-anchor="middle" font-size="10.5" fill="#b91c1c">profile missing</text>

  <line x1="720" y1="980" x2="593" y2="980" stroke="#10b981" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mGreen)"/>
  <text x="655" y="999" text-anchor="middle" font-size="10.5" fill="#047857">installed · re-check</text>

  <!-- ===== legend ===== -->
  <line x1="120" y1="1266" x2="160" y2="1266" stroke="#475569" stroke-width="2" marker-end="url(#mSlate)"/>
  <text x="172" y="1270" font-size="11.5" fill="#64748b">happy path</text>

  <line x1="300" y1="1266" x2="340" y2="1266" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mRed)"/>
  <text x="352" y="1270" font-size="11.5" fill="#64748b">failure branch</text>

  <line x1="520" y1="1266" x2="560" y2="1266" stroke="#10b981" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mGreen)"/>
  <text x="572" y="1270" font-size="11.5" fill="#64748b">recovery / retry</text>
</svg>
</body>
</html>
